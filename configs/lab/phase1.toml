model = "Qwen/Qwen3-30B-A3B-Instruct-2507"
max_steps = 250
batch_size = 256
rollouts_per_example = 16
learning_rate = 1.5e-5

[buffer]
online_difficulty_filtering = true
easy_threshold = 0.9 
hard_threshold = 0.09

[sampling]
max_tokens = 8000

[[env]]
id = "irfanjamil/CausalReasoningEnv@0.1.2"
args = {weights = [1.0, 0.0, 0.0, 0.0]}   # Flavor 1 only

[eval]
interval = 250                    # Evaluate every 250 steps
num_examples = 100
rollouts_per_example = 3
