model = "Qwen/Qwen2.5-7B-Instruct"

[env]
id = "CausalReasoningEnv"
args = {weights = [1.0, 0.0, 0.0, 0.0]}   # Flavor 1 only

[inference]
gpus = 1

[inference.args]
tensor_parallel_size = 1

[trainer]
gpus = 1
run_name = "causal-reasoning-phase1"

[trainer.args]
micro_batch_size = 4
rollouts_per_example = 8
batch_size = 64
max_steps = 500
max_seq_len = 4096