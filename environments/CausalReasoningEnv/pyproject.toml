[project]
name = "CausalReasoningEnv"
description = "Causal ATE estimation benchmark: identify and compute average treatment effects via probability query tools over discrete CPT-based DAGs."
tags = ["reasoning", "causal-reasoning", "graph-reasoning", "multi-turn", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "verifiers>=0.1.9.post3",
    "networkx>=3.0",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "CausalReasoningEnv.py",
    "env.py",
    "prompts.py",
    "pyproject.toml",
]

[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 1
