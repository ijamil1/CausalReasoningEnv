[project]
name = "CausalReasoningEnv"
description = "Multi-task causal reasoning benchmark and training environment: adjustment set identification, ATE estimation, SCM derivation, and structural equation fitting."
tags = ["reasoning", "causal-reasoning", "graph-reasoning", "multi-turn", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "verifiers>=0.1.9.post3",
    "networkx>=3.0",
    "datasets",
    "scipy",
    "pandas",
    "statsmodels",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "CausalReasoningEnv.py",
    "flavor1.py",
    "flavor2.py",
    "flavor3.py",
    "flavor4.py",
    "prompts.py",
    "pyproject.toml",
]

[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 1